<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
body { width: 816px; min-height: 1056px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: #fff; color: #0D1F16; }
.page { width: 816px; min-height: 1056px; display: flex; flex-direction: column; }
.header { background: #0D1F16; padding: 18px 40px; display: flex; align-items: center; justify-content: space-between; }
.header-left { display: flex; align-items: center; gap: 12px; }
.logo-name { color: #fff; font-size: 16px; font-weight: 900; }
.header-divider { width: 1px; height: 20px; background: rgba(255,255,255,0.2); }
.header-section { color: #6EE7B7; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
.header-county { color: rgba(255,255,255,0.5); font-size: 11px; }
.body { padding: 28px 40px 20px; flex: 1; }
.section-title-wrap { margin-bottom: 20px; }
.section-title { font-size: 22px; font-family: Georgia, 'Times New Roman', serif; font-weight: 700; color: #0D1F16; line-height: 1.15; }
.section-accent { height: 3px; background: linear-gradient(90deg, #1D9E75 0%, rgba(29,158,117,0) 100%); margin-top: 8px; border-radius: 2px; }
.divider { height: 1px; background: #E5E7EB; margin: 28px 0; }
.insight-text { font-size: 15px; color: #000; line-height: 1.8; }
.rec-block { border-left: 4px solid #0D1F16; padding: 16px 20px; background: transparent; }
.rec-signal { font-size: 22px; font-weight: 900; color: #0D1F16; margin-bottom: 10px; letter-spacing: -0.3px; }
.rec-body { font-size: 15px; color: #000; line-height: 1.7; }
.no-break { page-break-inside: avoid; break-inside: avoid; }
@media print { .no-break { page-break-inside: avoid; break-inside: avoid; } }
.footer { background: #0D1F16; padding: 12px 40px; display: flex; align-items: center; justify-content: space-between; }
.footer-left { color: rgba(255,255,255,0.55); font-size: 13px; }
.footer-center { color: #fff; font-size: 13px; font-weight: 700; }
.footer-right { color: rgba(255,255,255,0.55); font-size: 13px; }
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <div class="header-left">
      <div class="logo-name">LotScout</div>
      <div class="header-divider"></div>
      <div class="header-section">Our Recommendation</div>
    </div>
    <div class="header-county">{{county_name}}</div>
  </div>

  <div class="body">
    <div class="section-title-wrap">
      <div class="section-title">LotScout Insight</div>
      <div class="section-accent"></div>
    </div>
    <div class="insight-text no-break">{{insight_paragraph}}</div>

    <div class="divider"></div>
    <div class="section-title-wrap">
      <div class="section-title">Our Recommendation</div>
      <div class="section-accent"></div>
    </div>
    <div class="rec-block no-break">
      <div class="rec-signal">{{recommendation_signal}}</div>
      <div class="rec-body">{{recommendation_body}}</div>
    </div>
  </div>

  <div class="footer">
    <div class="footer-left">The #1 Platform for Land Data and Off-Market Deals</div>
    <div class="footer-center">lotscout.com</div>
    <div class="footer-right">9 of 10</div>
  </div>
</div>
</body>
</html>
